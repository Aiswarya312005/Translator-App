<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Translator App</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .container{
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
        }

        .title{
            text-align: center;
            margin-bottom: 25px;
        }

        .title h1{
            color: #333;
            font-size: 32px;
        }

        .title p{
            color: gray;
            margin-top: 5px;
            font-size: 14px;
        }

        textarea{
            width: 100%;
            height: 140px;
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus{
            border-color: #4facfe;
        }

        .controls{
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        select{
            width: 48%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #ddd;
            font-size: 15px;
            outline: none;
        }

        button{
            width: 48%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #4facfe;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background: #2196f3;
        }

        .output-box{
            margin-top: 25px;
            background: #f5f7fa;
            padding: 18px;
            border-radius: 12px;
        }

        .output-box h3{
            margin-bottom: 10px;
            color: #333;
        }

        .output-text{
            color: #555;
            font-size: 16px;
            line-height: 1.5;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="title">
            <h1>AI Translator</h1>
            <p>Translate text instantly into multiple languages</p>
        </div>

        <form method="POST">

            <textarea
                name="text"
                placeholder="Enter your text here..."
                required></textarea>

            <div class="controls">

                <select name="language">

                        <option value="hi">Hindi</option>
                        <option value="te">Telugu</option>
                        <option value="ta">Tamil</option>
                        <option value="ml">Malayalam</option>
                        <option value="kn">Kannada</option>
                        <option value="fr">French</option>
                        <option value="es">Spanish</option>
                        <option value="de">German</option>
                        <option value="ko">Korean</option>
                        <option value="ja">Japanese</option>
                        <option value="zh-CN">Chinese</option>
                        <option value="ru">Russian</option>
                        <option value="ar">Arabic</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>

                </select>

                <button type="submit">
                    Translate
                </button>

            </div>

        </form>

        {% if translated_text %}

        <div class="output-box">

            <h3>Translated Text</h3>

            <div class="output-text">
                {{ translated_text }}
            </div>

        </div>

        {% endif %}

    </div>

</body>

</html>
